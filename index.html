<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Shooters FPS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c;font-family:Arial;color:#fff}canvas{display:block}#menu,#death{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(#05070dcc,#05070df2);text-align:center}#death{display:none}h1{font-size:64px;letter-spacing:6px;margin:0 0 8px}button{border:0;border-radius:8px;background:#f5c542;color:#111;padding:16px 48px;font-size:21px;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.1)}.hint{color:#aaa}.hud{position:fixed;z-index:10;inset:0;pointer-events:none}.box{position:absolute;left:18px;top:18px;width:310px;padding:14px;background:#0b1018dd;border:1px solid #ffffff22;border-radius:10px}.row{display:flex;justify-content:space-between;margin:5px 0}.bar{height:9px;background:#29303a;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%}#hpbar{background:#e44}#xpbar{background:#4ca0ff}#weapon{font-size:19px;font-weight:bold;margin-top:9px}#ammo{position:absolute;right:24px;bottom:24px;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000}#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}#cross i,#cross b{position:absolute;background:#fff;display:block}#cross i{width:20px;height:2px;top:9px}#cross b{width:2px;height:20px;left:9px}.feed{position:absolute;right:18px;top:18px;text-align:right;font-weight:bold}.hit{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;color:#fff;opacity:0;pointer-events:none}.botdot{width:8px;height:8px;background:#e44;border-radius:50%;display:inline-block;margin-right:5px}</style></head><body><div id="menu"><h1>CRAZY SHOOTERS</h1><p>Competitive-style 3D FPS • bots • weapons • rounds • RPG</p><button id="play" type="button">PLAY NOW</button><p class="hint">WASD move · Mouse aim · LMB fire · R reload · 1/2/3 weapons · Shift sprint · Space jump</p></div><div id="death"><h1>ROUND LOST</h1><p id="result"></p><button id="respawn">PLAY AGAIN</button></div><div class="hud"><div class="box"><b>CRAZY SHOOTERS</b><div class="row"><span>HP</span><span id="hpt">100 / 100</span></div><div class="bar"><div id="hpbar" class="fill"></div></div><div class="row"><span>LEVEL <b id="lv">1</b></span><span>XP <span id="xpt">0 / 100</span></span></div><div class="bar"><div id="xpbar" class="fill"></div></div><div class="row"><span>KILLS <b id="kills">0</b></span><span>$<b id="cash">800</b></span></div><div id="weapon">PISTOL</div></div><div class="feed" id="feed"></div><div id="cross"><i></i><b></b></div><div id="ammo">12 / 48</div></div><div id="game"></div><div class="hit" id="hit">×</div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
'use strict';
var scene,camera,renderer,clock;var running=false,locked=false;var yaw=0,pitch=0,vy=0,onGround=true;var keys={};var enemies=[],enemyBullets=[],raycaster=new THREE.Raycaster();var hp=100,maxHp=100,level=1,xp=0,nextXp=100,kills=0,cash=800;var weaponIndex=0,ammo=12,reserve=48,reloading=false,lastShot=0,roundTime=0;var weapons=[{name:'PISTOL',mag:12,reserve:48,damage:35,rate:280,pellets:1,spread:.01},{name:'RIFLE',mag:30,reserve:90,damage:22,rate:95,pellets:1,spread:.025},{name:'SHOTGUN',mag:8,reserve:32,damage:18,rate:650,pellets:8,spread:.12}];
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x111820);scene.fog=new THREE.Fog(0x111820,18,100);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,200);camera.position.set(0,1.7,12);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xddeaff,0x222222,2.2));var sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(10,20,10);scene.add(sun);makeMap();clock=new THREE.Clock();hud();requestAnimationFrame(loop)}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.8})}function box(x,y,z,w,h,d,c){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}function makeMap(){var floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat(0x252c32));floor.rotation.x=-Math.PI/2;scene.add(floor);box(0,3,-48,96,6,2,0x59636b);box(0,3,48,96,6,2,0x59636b);box(-48,3,0,2,6,96,0x59636b);box(48,3,0,2,6,96,0x59636b);[[0,1.5,0,12,3,3],[-16,1.5,-10,7,3,5],[16,1.5,12,7,3,5],[-22,1.5,22,5,3,8],[22,1.5,-22,5,3,8],[0,2,-28,18,4,2]].forEach(function(a){box(a[0],a[1],a[2],a[3],a[4],a[5],0x806244)})}
function reset(){hp=100;maxHp=100;level=1;xp=0;nextXp=100;kills=0;cash=800;weaponIndex=0;reloading=false;yaw=0;pitch=0;vy=0;camera.position.set(0,1.7,12);enemies.forEach(function(e){scene.remove(e.group)});enemies=[];enemyBullets=[];weapons[0].mag=12;weapons[0].reserve=48;weapons[1].mag=30;weapons[1].reserve=90;weapons[2].mag=8;weapons[2].reserve=32;setWeapon(0);hud()}
function startGame(){document.getElementById('menu').style.display='none';document.getElementById('death').style.display='none';reset();running=true;renderer.domElement.requestPointerLock();for(var i=0;i<5;i++)spawnEnemy();clock.start()}
function die(){running=false;document.exitPointerLock();document.getElementById('result').textContent='Kills: '+kills+'  •  Level: '+level+'  •  Cash: $'+cash;document.getElementById('death').style.display='flex'}
function spawnEnemy(){var e={};var g=new THREE.Group();var body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.6,.8),mat(0xc83b43));body.position.y=1.05;g.add(body);var head=new THREE.Mesh(new THREE.BoxGeometry(.75,.65,.65),mat(0x8e232b));head.position.y=2.18;g.add(head);var gun=new THREE.Mesh(new THREE.BoxGeometry(.15,.15,1.2),mat(0x222222));gun.position.set(0,1.1,.65);g.add(gun);var spots=[[-35,-35],[35,-30],[-32,32],[34,30],[0,-40],[0,40]];var p=spots[Math.floor(Math.random()*spots.length)];g.position.set(p[0]+(Math.random()*8-4),0,p[1]+(Math.random()*8-4));scene.add(g);e.group=g;e.hp=90+level*8;e.max=e.hp;e.cool=Math.random()*2;e.speed=1.3+level*.06;e.shoot=1.5+Math.random()*2;enemies.push(e)}
function setWeapon(i){weaponIndex=i;var w=weapons[i];ammo=w.mag;reserve=w.reserve;reloading=false;document.getElementById('weapon').textContent=w.name;hud()}
function reload(){if(reloading||ammo>=weapons[weaponIndex].mag||reserve<=0)return;reloading=true;hud();setTimeout(function(){var w=weapons[weaponIndex];var n=Math.min(w.mag-ammo,reserve);ammo+=n;reserve-=n;reloading=false;hud()},700)}
function shoot(){if(!running||!locked||reloading)return;var w=weapons[weaponIndex],now=performance.now();if(now-lastShot<w.rate)return;if(ammo<=0){reload();return}lastShot=now;ammo--;for(var k=0;k<w.pellets;k++){var sx=(Math.random()-.5)*w.spread,sy=(Math.random()-.5)*w.spread;raycaster.setFromCamera(new THREE.Vector2(sx,sy),camera);var objs=[];enemies.forEach(function(e){e.group.traverse(function(o){if(o.isMesh)objs.push(o)})});var hit=raycaster.intersectObjects(objs,false);if(hit.length){var en=enemies.find(function(e){return e.group===hit[0].object.parent||e.group.children.includes(hit[0].object)});if(!en){en=enemies.find(function(e){return e.group.getObjectById(hit[0].object.id)})}if(en){en.hp-=w.damage;flashHit();if(en.hp<=0){scene.remove(en.group);enemies.splice(enemies.indexOf(en),1);kills++;cash+=100;gainXp(35);showFeed('ENEMY DOWN +$100');if(enemies.length<5)spawnEnemy()}}}}hud()}
function gainXp(n){xp+=n;if(xp>=nextXp){xp-=nextXp;level++;nextXp=Math.floor(nextXp*1.35);maxHp+=10;hp=maxHp;weapons[0].damage+=4;weapons[1].damage+=3;weapons[2].damage+=2;showFeed('LEVEL UP '+level)}}function flashHit(){var h=document.getElementById('hit');h.style.opacity=1;setTimeout(function(){h.style.opacity=0},80)}function showFeed(t){var f=document.getElementById('feed');f.textContent=t;setTimeout(function(){if(f.textContent===t)f.textContent=''},1200)}
function enemyShoot(e){var a=new THREE.Vector3();a.copy(camera.position).sub(e.group.position);a.y=0;var d=a.length();if(d>45)return;a.normalize();enemyBullets.push({p:e.group.position.clone().add(new THREE.Vector3(0,1.3,0)),v:a.multiplyScalar(18),life:3})}
function update(dt){var speed=(keys.ShiftLeft||keys.ShiftRight)?9:6;var dir=new THREE.Vector3();if(keys.KeyW)dir.z-=1;if(keys.KeyS)dir.z+=1;if(keys.KeyA)dir.x-=1;if(keys.KeyD)dir.x+=1;if(dir.lengthSq()){dir.normalize();var sin=Math.sin(yaw),cos=Math.cos(yaw);var x=dir.x*cos-dir.z*sin,z=dir.x*sin+dir.z*cos;camera.position.x+=x*speed*dt;camera.position.z+=z*speed*dt}if(keys.Space&&onGround){vy=7;onGround=false}vy-=18*dt;camera.position.y+=vy*dt;if(camera.position.y<=1.7){camera.position.y=1.7;vy=0;onGround=true}camera.position.x=Math.max(-45,Math.min(45,camera.position.x));camera.position.z=Math.max(-45,Math.min(45,camera.position.z));enemies.forEach(function(e){var dx=camera.position.x-e.group.position.x,dz=camera.position.z-e.group.position.z,d=Math.hypot(dx,dz);if(d>4){e.group.position.x+=dx/d*e.speed*dt;e.group.position.z+=dz/d*e.speed*dt}e.group.lookAt(camera.position.x,e.group.position.y+1,camera.position.z);e.shoot-=dt;if(e.shoot<=0){enemyShoot(e);e.shoot=1.5+Math.random()*2}});for(var i=enemyBullets.length-1;i>=0;i--){var b=enemyBullets[i];b.p.addScaledVector(b.v,dt);b.life-=dt;if(b.life<=0){enemyBullets.splice(i,1);continue}if(b.p.distanceTo(camera.position)<.8){hurt(10+level);enemyBullets.splice(i,1)}}if(camera.position.distanceTo(new THREE.Vector3(0,0,0))<7){} }
function hurt(n){hp-=n;hud();if(hp<=0)die()}
function hud(){var w=weapons[weaponIndex];document.getElementById('hpt').textContent=Math.ceil(hp)+' / '+maxHp;document.getElementById('hpbar').style.width=Math.max(0,hp/maxHp*100)+'%';document.getElementById('lv').textContent=level;document.getElementById('xpt').textContent=xp+' / '+nextXp;document.getElementById('xpbar').style.width=xp/nextXp*100+'%';document.getElementById('kills').textContent=kills;document.getElementById('cash').textContent=cash;document.getElementById('ammo').textContent=reloading?'RELOADING...':ammo+' / '+reserve;document.getElementById('weapon').textContent=w.name}
function loop(){requestAnimationFrame(loop);var dt=Math.min(clock.getDelta(),.05);if(running)update(dt);renderer.render(scene,camera)}
document.getElementById('play').addEventListener('click',startGame);document.getElementById('respawn').addEventListener('click',startGame);document.addEventListener('pointerlockchange',function(){locked=document.pointerLockElement===renderer.domElement;if(running&&!locked){showFeed('CLICK TO CAPTURE MOUSE')}});document.addEventListener('mousemove',function(e){if(!locked)return;yaw-=e.movementX*.0024;pitch-=e.movementY*.0024;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});document.addEventListener('mousedown',function(e){if(running&&!locked){renderer.domElement.requestPointerLock();return}if(running&&e.button===0)shoot()});document.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Digit1')setWeapon(0);if(e.code==='Digit2')setWeapon(1);if(e.code==='Digit3')setWeapon(2)});document.addEventListener('keyup',function(e){keys[e.code]=false});addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});init();
</script></body></html>
