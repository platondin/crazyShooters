<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Shooters RPG</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a0d;color:#fff;font-family:Arial}#game{position:fixed;inset:0}#menu,#dead{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05070bed;text-align:center}#dead{display:none}h1{font-size:64px;letter-spacing:5px;margin:0 0 12px}button{padding:16px 40px;border:0;border-radius:10px;background:#ffd84d;color:#111;font-size:20px;font-weight:900;cursor:pointer}.small{color:#bbb;max-width:650px;line-height:1.5}.hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;top:18px;left:18px;width:300px;padding:14px;background:#10151dcc;border:1px solid #ffffff22;border-radius:12px}.row{display:flex;justify-content:space-between;margin:6px 0}.bar{height:10px;background:#292f38;border-radius:8px;overflow:hidden}.fill{height:100%}#hp{background:#e5484d}#xp{background:#4b9cff}#ammo{position:absolute;right:25px;bottom:25px;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:white}#cross:before{width:22px;height:2px;top:10px}#cross:after{height:22px;width:2px;left:10px}</style></head><body><div id="game"></div><div class="hud"><div class="panel"><b style="font-size:20px">CRAZY SHOOTERS RPG</b><div class="row"><span>HP</span><span id="hpTxt">100 / 100</span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="row"><span>LEVEL <b id="lvl">1</b></span><span>XP <span id="xpTxt">0 / 100</span></span></div><div class="bar"><div id="xp" class="fill"></div></div><div class="row"><span>KILLS <b id="kills">0</b></span><span>$<b id="money">0</b></span></div><div id="weapon">PISTOL</div></div><div id="cross"></div><div id="ammo">12 / 60</div></div><div id="menu"><h1>CRAZY SHOOTERS</h1><p class="small">3D FPS • bots • multiple weapons • RPG progression</p><button id="startBtn">PLAY NOW</button><p>WASD · Mouse · Click · R · Shift · Space · 1/2/3 weapons</p></div><div id="dead"><h1>YOU DIED</h1><p id="score"></p><button id="again">RESPAWN</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151c);scene.fog=new THREE.Fog(0x10151c,20,110);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);camera.position.set(0,1.7,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbdd8ff,0x202020,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(10,20,8);scene.add(sun);
const keys={};let locked=false;addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();if(e.code==='Digit1')setWeapon(0);if(e.code==='Digit2')setWeapon(1);if(e.code==='Digit3')setWeapon(2)});addEventListener('keyup',e=>keys[e.code]=false);document.body.addEventListener('click',()=>{if(running)document.body.requestPointerLock()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===document.body);document.addEventListener('mousemove',e=>{if(!locked)return;camera.rotation.y-=e.movementX*.0025;camera.rotation.x-=e.movementY*.0025;camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x))});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x252c34}));floor.rotation.x=-Math.PI/2;scene.add(floor);function box(x,y,z,w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m)}box(0,3,-45,90,6,2,0x56616d);box(0,3,45,90,6,2,0x56616d);box(-45,3,0,2,6,90,0x56616d);box(45,3,0,2,6,90,0x56616d);[[0,1.5,0,10,3,3],[-15,1.5,-10,6,3,4],[16,1.5,12,7,3,4],[-22,1.5,20,4,3,7],[22,1.5,-20,4,3,7]].forEach(a=>box(...a,0x806044));
const weapons=[{name:'PISTOL',mag:12,max:60,damage:35,delay:260,pellets:1},{name:'RIFLE',mag:30,max:120,damage:22,delay:105,pellets:1},{name:'SHOTGUN',mag:6,max:36,damage:14,delay:650,pellets:7}];let wi=0,ammo=12,reserve=60,reloading=false,lastShot=0,running=false,dead=false,hp=100,maxHp=100,level=1,xp=0,nextXp=100,kills=0,money=0,speed=7;function setWeapon(i){if(reloading)return;wi=i;ammo=Math.min(weapons[wi].mag,ammo);reserve=weapons[wi].max;hud()}function reload(){let w=weapons[wi];if(reloading||ammo>=w.mag||reserve<=0)return;reloading=true;hud();setTimeout(()=>{let n=Math.min(w.mag-ammo,reserve);ammo+=n;reserve-=n;reloading=false;hud()},700)}
const enemies=[];const ray=new THREE.Raycaster();function spawn(){let e=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.8),new THREE.MeshStandardMaterial({color:0xe5484d}));body.position.y=1.15;e.add(body);let head=new THREE.Mesh(new THREE.BoxGeometry(.8,.7,.7),new THREE.MeshStandardMaterial({color:0x651b24}));head.position.y=2.25;e.add(head);e.userData={hp:90+level*15,cool:Math.random()*50};e.position.set((Math.random()-.5)*70,0,(Math.random()-.5)*70);if(e.position.distanceTo(camera.position)<15)e.position.x+=25;scene.add(e);enemies.push(e)}function shoot(){if(!running||dead||reloading)return;let w=weapons[wi],now=performance.now();if(now-lastShot<w.delay)return;if(ammo<=0){reload();return}lastShot=now;ammo--;for(let p=0;p<w.pellets;p++){ray.setFromCamera(new THREE.Vector2((Math.random()-.5)*.025,(Math.random()-.5)*.025),camera);let hits=ray.intersectObjects(enemies.flatMap(e=>e.children));if(hits.length){let e=enemies.find(x=>x.children.includes(hits[0].object));if(e){e.userData.hp-=w.damage;if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;money+=10;xp+=30;if(xp>=nextXp){xp-=nextXp;level++;nextXp=Math.floor(nextXp*1.35);damageBoost()}}}}}hud()}function damageBoost(){weapons.forEach(w=>w.damage+=3);maxHp+=15;hp=maxHp;speed+=.25}function hurt(n){hp-=n;if(hp<=0){hp=0;dead=true;running=false;document.exitPointerLock();document.querySelector('#score').textContent='Kills: '+kills+' • Level: '+level;document.querySelector('#dead').style.display='flex'}hud()}
function hud(){let w=weapons[wi];document.querySelector('#hpTxt').textContent=Math.ceil(hp)+' / '+maxHp;document.querySelector('#hp').style.width=hp/maxHp*100+'%';document.querySelector('#lvl').textContent=level;document.querySelector('#xpTxt').textContent=xp+' / '+nextXp;document.querySelector('#xp').style.width=xp/nextXp*100+'%';document.querySelector('#kills').textContent=kills;document.querySelector('#money').textContent=money;document.querySelector('#weapon').textContent=w.name;document.querySelector('#ammo').textContent=reloading?'RELOADING...':ammo+' / '+reserve}
let spawnT=0;const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(running&&!dead){let v=speed*(keys.ShiftLeft||keys.ShiftRight?1.4:1);if(keys.KeyW)camera.translateZ(-v*dt);if(keys.KeyS)camera.translateZ(v*dt);if(keys.KeyA)camera.translateX(-v*dt);if(keys.KeyD)camera.translateX(v*dt);camera.position.y=1.7;camera.position.x=Math.max(-42,Math.min(42,camera.position.x));camera.position.z=Math.max(-42,Math.min(42,camera.position.z));spawnT+=dt;if(spawnT>Math.max(.5,1.4-level*.05)&&enemies.length<8+level){spawn();spawnT=0}for(const e of enemies){let dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,d=Math.hypot(dx,dz);if(d>2.4){e.position.x+=dx/d*(1.2+level*.05)*dt;e.position.z+=dz/d*(1.2+level*.05)*dt}else{e.userData.cool-=dt*60;if(e.userData.cool<=0){hurt(5+level);e.userData.cool=55}}e.lookAt(camera.position.x,e.position.y,camera.position.z)}}renderer.render(scene,camera)}document.querySelector('#startBtn').onclick=e=>{e.stopPropagation();document.querySelector('#menu').style.display='none';running=true;document.body.requestPointerLock();hud()};document.addEventListener('mousedown',e=>{if(running&&locked&&e.button===0)shoot()});document.querySelector('#again').onclick=()=>location.reload();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});hud();loop();</script></body></html>
