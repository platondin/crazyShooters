<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Shooters RPG</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a0d;font-family:Arial;color:#fff}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;left:18px;top:18px;width:290px;background:#10151dcc;padding:14px;border:1px solid #ffffff22;border-radius:12px}#title{font-weight:900;font-size:20px;letter-spacing:2px;margin-bottom:8px}.row{display:flex;justify-content:space-between;margin:5px 0;font-size:14px}.bar{height:10px;background:#252b33;border-radius:8px;overflow:hidden;margin:4px 0 9px}.fill{height:100%}#hp{background:#e5484d}#xp{background:#4b9cff}#ammo{position:absolute;right:25px;bottom:25px;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000}#weapon{font-size:14px;color:#ffd84d}#cross{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:white;opacity:.9}#cross:before{width:24px;height:2px;top:11px;left:0}#cross:after{height:24px;width:2px;left:11px;top:0}#tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#0009;padding:8px 14px;border-radius:8px;font-size:13px}#level{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-size:38px;font-weight:900;opacity:0;transition:.2s}#menu,#dead{position:fixed;inset:0;background:#05070bd9;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:5}#menu h1{font-size:64px;margin:0 0 10px;letter-spacing:5px}button{padding:13px 28px;border:0;border-radius:9px;background:#ffd84d;font-weight:900;font-size:17px;cursor:pointer}#dead{display:none}#dead h1{font-size:64px;margin:0 0 10px}.small{color:#aaa;max-width:600px;line-height:1.5}</style></head><body><div id="game"></div><div id="hud"><div id="top"><div id="title">CRAZY SHOOTERS RPG</div><div class="row"><span>HP</span><span id="hpTxt">100 / 100</span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="row"><span>LEVEL <b id="lvl">1</b></span><span>XP <span id="xpTxt">0 / 100</span></span></div><div class="bar"><div id="xp" class="fill"></div></div><div class="row"><span>KILLS <b id="kills">0</b></span><span>$<b id="money">0</b></span></div><div id="weapon">PISTOL</div></div><div id="cross"></div><div id="ammo">12 / 60</div><div id="tip">WASD move · Mouse aim · Click shoot · R reload · Shift sprint · Space jump</div><div id="level">LEVEL UP!</div></div><div id="menu"><h1>CRAZY SHOOTERS</h1><p class="small">Original browser FPS inspired by fast arena shooters. Fight bots, earn XP and upgrade your character.</p><button id="start">PLAY</button></div><div id="dead"><h1>YOU DIED</h1><p id="score"></p><button id="again">RESPAWN</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {PointerLockControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151c);scene.fog=new THREE.Fog(0x10151c,20,100);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbdd8ff,0x202020,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(10,20,8);sun.castShadow=true;scene.add(sun);
const controls=new PointerLockControls(camera,document.body);scene.add(controls.getObject());
const mats={floor:new THREE.MeshStandardMaterial({color:0x252c34}),wall:new THREE.MeshStandardMaterial({color:0x56616d}),crate:new THREE.MeshStandardMaterial({color:0x8a6844}),enemy:new THREE.MeshStandardMaterial({color:0xe5484d}),enemyDark:new THREE.MeshStandardMaterial({color:0x6e1e25})};
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mats.floor);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
function box(x,y,z,sx,sy,sz,mat=mats.wall){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
box(0,3,-45,90,6,2);box(0,3,45,90,6,2);box(-45,3,0,2,6,90);box(45,3,0,2,6,90);[[0,1.5,0,10,3,3],[-15,1.5,-10,6,3,4],[16,1.5,12,7,3,4],[-22,1.5,20,4,3,7],[22,1.5,-20,4,3,7]].forEach(a=>box(...a,mats.crate));
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload();});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let running=false,dead=false,ammo=12,reserve=60,reloading=false,lastShot=0,kills=0,level=1,xp=0,nextXp=100,money=0,maxHp=100,hp=100,damage=34,speed=7,fireDelay=170;const bullets=[],enemies=[],ray=new THREE.Raycaster();
function makeEnemy(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.8),mats.enemy);body.position.y=1.15;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.8,.7,.7),mats.enemyDark);head.position.y=2.25;head.castShadow=true;g.add(head);g.userData={hp:80+level*12,max:80+level*12,cool:Math.random()*80,body};return g}
function spawn(){let x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.hypot(x-camera.position.x,z-camera.position.z)<18){x+=25}const e=makeEnemy();e.position.set(x,0,z);scene.add(e);enemies.push(e)}
function shoot(){if(!running||dead||reloading)return;const now=performance.now();if(now-lastShot<fireDelay)return;if(ammo<=0){reload();return}lastShot=now;ammo--;updateHud();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies.flatMap(e=>e.children),false);if(hits.length){const e=enemies.find(x=>x===hits[0].object.parent||x.children.includes(hits[0].object));if(e){e.userData.hp-=damage;hitFX(e.position);if(e.userData.hp<=0)kill(e)}}}
function hitFX(p){const c=new THREE.Mesh(new THREE.SphereGeometry(.15,8,8),new THREE.MeshBasicMaterial({color:0xffff66}));c.position.copy(p);scene.add(c);setTimeout(()=>scene.remove(c),100)}
function kill(e){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;money+=10;xp+=30;updateHud();if(xp>=nextXp){xp-=nextXp;level++;nextXp=Math.floor(nextXp*1.35);damage+=8;maxHp+=15;hp=maxHp;speed+=.35;fireDelay=Math.max(90,fireDelay-10);showLevel()}}
function reload(){if(reloading||ammo===12||reserve<=0)return;reloading=true;setTimeout(()=>{const n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;updateHud()},900)}
function showLevel(){const el=document.querySelector('#level');el.textContent='LEVEL '+level;el.style.opacity=1;setTimeout(()=>el.style.opacity=0,1000)}
function updateHud(){document.querySelector('#hpTxt').textContent=Math.ceil(hp)+' / '+maxHp;document.querySelector('#hp').style.width=Math.max(0,hp/maxHp*100)+'%';document.querySelector('#lvl').textContent=level;document.querySelector('#xpTxt').textContent=xp+' / '+nextXp;document.querySelector('#xp').style.width=xp/nextXp*100+'%';document.querySelector('#kills').textContent=kills;document.querySelector('#money').textContent=money;document.querySelector('#ammo').textContent=(reloading?'RELOADING...':ammo+' / '+reserve)}
function hurt(n){hp-=n;if(hp<=0){hp=0;dead=true;running=false;controls.unlock();document.querySelector('#score').textContent='Kills: '+kills+' · Level: '+level;document.querySelector('#dead').style.display='flex'}updateHud()}
let clock=new THREE.Clock(),spawnT=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(running&&!dead){let v=speed*(keys.ShiftLeft||keys.ShiftRight?1.35:1);if(keys.KeyW)controls.moveForward(v*dt);if(keys.KeyS)controls.moveForward(-v*dt);if(keys.KeyA)controls.moveRight(-v*dt);if(keys.KeyD)controls.moveRight(v*dt);camera.position.y=1.7+(keys.Space?0.5:0);spawnT+=dt;if(spawnT>Math.max(.45,1.4-level*.06)&&enemies.length<7+level){spawn();spawnT=0}enemies.forEach(e=>{const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z;const d=Math.hypot(dx,dz);if(d>2.5){e.position.x+=dx/d*(1.1+level*.04)*dt;e.position.z+=dz/d*(1.1+level*.04)*dt}else{e.userData.cool-=dt*60;if(e.userData.cool<=0){hurt(4+level);e.userData.cool=55}}e.lookAt(camera.position.x,e.position.y,camera.position.z)})}renderer.render(scene,camera)}loop();
addEventListener('mousedown',()=>{if(running)shoot()});addEventListener('keydown',e=>{if(e.code==='KeyR')reload()});document.querySelector('#start').onclick=()=>{document.querySelector('#menu').style.display='none';running=true;controls.lock()};document.querySelector('#again').onclick=()=>location.reload();controls.addEventListener('lock',()=>{});updateHud();
</script></body></html>
