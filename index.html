<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crazy Shooters RPG</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a0d;color:white;font-family:Arial}#game{position:fixed;inset:0}#menu,#dead{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,5,8,.94);text-align:center}#dead{display:none}h1{font-size:64px;letter-spacing:5px;margin:0 0 12px}button{padding:16px 38px;border:0;border-radius:10px;background:#ffd84d;color:#111;font-size:20px;font-weight:900;cursor:pointer;pointer-events:auto}.small{color:#bbb;max-width:650px;line-height:1.5}.hud{position:fixed;z-index:10;inset:0;pointer-events:none}.panel{position:absolute;top:18px;left:18px;width:290px;padding:14px;background:#10151dcc;border:1px solid #ffffff22;border-radius:12px}.row{display:flex;justify-content:space-between;margin:6px 0}.bar{height:10px;background:#292f38;border-radius:8px;overflow:hidden}.fill{height:100%}#hp{background:#e5484d}#xp{background:#4b9cff}#ammo{position:absolute;right:25px;bottom:25px;font-size:34px;font-weight:900;text-shadow:0 3px 8px #000}#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:white}#cross:before{width:22px;height:2px;top:10px}#cross:after{height:22px;width:2px;left:10px}</style></head><body><div id="game"></div><div class="hud"><div class="panel"><b style="font-size:20px">CRAZY SHOOTERS RPG</b><div class="row"><span>HP</span><span id="hpTxt">100 / 100</span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="row"><span>LEVEL <b id="lvl">1</b></span><span>XP <span id="xpTxt">0 / 100</span></span></div><div class="bar"><div id="xp" class="fill"></div></div><div class="row"><span>KILLS <b id="kills">0</b></span><span>$<b id="money">0</b></span></div><div id="weapon">PISTOL</div></div><div id="cross"></div><div id="ammo">12 / 60</div></div><div id="menu"><h1>CRAZY SHOOTERS</h1><p class="small">3D browser FPS • fight bots • earn XP • unlock stronger weapons</p><button id="startBtn" type="button">PLAY NOW</button><p>WASD · Mouse · Click · R · Shift · Space</p></div><div id="dead"><h1>YOU DIED</h1><p id="score"></p><button id="again" type="button">RESPAWN</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {PointerLockControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10151c);scene.fog=new THREE.Fog(0x10151c,20,100);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);camera.position.set(0,1.7,8);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.querySelector('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbdd8ff,0x202020,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(10,20,8);scene.add(sun);const controls=new PointerLockControls(camera,document.body);scene.add(controls.getObject());
const wall=new THREE.MeshStandardMaterial({color:0x56616d}),floorMat=new THREE.MeshStandardMaterial({color:0x252c34}),crate=new THREE.MeshStandardMaterial({color:0x8a6844}),enemyMat=new THREE.MeshStandardMaterial({color:0xe5484d}),dark=new THREE.MeshStandardMaterial({color:0x651b24});function box(x,y,z,a,b,c,m=wall){let q=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);q.position.set(x,y,z);scene.add(q);return q}let f=new THREE.Mesh(new THREE.PlaneGeometry(120,120),floorMat);f.rotation.x=-Math.PI/2;scene.add(f);box(0,3,-45,90,6,2);box(0,3,45,90,6,2);box(-45,3,0,2,6,90);box(45,3,0,2,6,90);[[0,1.5,0,10,3,3],[-15,1.5,-10,6,3,4],[16,1.5,12,7,3,4],[-22,1.5,20,4,3,7],[22,1.5,-20,4,3,7]].forEach(a=>box(...a,crate));
const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let running=false,dead=false,ammo=12,reserve=60,reloading=false,lastShot=0,kills=0,level=1,xp=0,nextXp=100,money=0,hp=100,maxHp=100,damage=34,speed=7,delay=170;const enemies=[],ray=new THREE.Raycaster();function enemy(){let g=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.8),enemyMat);b.position.y=1.15;g.add(b);let h=new THREE.Mesh(new THREE.BoxGeometry(.8,.7,.7),dark);h.position.y=2.25;g.add(h);g.userData={hp:80+level*12,cool:Math.random()*50};return g}function spawn(){let x=(Math.random()-.5)*70,z=(Math.random()-.5)*70;if(Math.hypot(x-camera.position.x,z-camera.position.z)<18)x+=25;let e=enemy();e.position.set(x,0,z);scene.add(e);enemies.push(e)}function reload(){if(reloading||ammo===12||reserve<=0)return;reloading=true;setTimeout(()=>{let n=Math.min(12-ammo,reserve);ammo+=n;reserve-=n;reloading=false;hud()},800)}function shoot(){if(!running||dead||reloading)return;let t=performance.now();if(t-lastShot<delay)return;if(ammo<=0){reload();return}lastShot=t;ammo--;ray.setFromCamera(new THREE.Vector2(0,0),camera);let hit=ray.intersectObjects(enemies.flatMap(e=>e.children));if(hit.length){let e=enemies.find(x=>x.children.includes(hit[0].object));if(e){e.userData.hp-=damage;if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;money+=10;xp+=30;if(xp>=nextXp){xp-=nextXp;level++;nextXp=Math.floor(nextXp*1.35);damage+=8;maxHp+=15;hp=maxHp;speed+=.3;delay=Math.max(90,delay-8)}}}}hud()}function hud(){document.querySelector('#hpTxt').textContent=Math.ceil(hp)+' / '+maxHp;document.querySelector('#hp').style.width=hp/maxHp*100+'%';document.querySelector('#lvl').textContent=level;document.querySelector('#xpTxt').textContent=xp+' / '+nextXp;document.querySelector('#xp').style.width=xp/nextXp*100+'%';document.querySelector('#kills').textContent=kills;document.querySelector('#money').textContent=money;document.querySelector('#ammo').textContent=reloading?'RELOADING...':ammo+' / '+reserve}function hurt(n){hp-=n;if(hp<=0){hp=0;dead=true;running=false;controls.unlock();document.querySelector('#score').textContent='Kills: '+kills+'  •  Level: '+level;document.querySelector('#dead').style.display='flex'}hud()}
addEventListener('mousedown',()=>{if(running)shoot()});addEventListener('keydown',e=>{if(e.code==='KeyR')reload()});document.querySelector('#startBtn').addEventListener('click',()=>{document.querySelector('#menu').style.display='none';running=true;controls.lock()});document.querySelector('#again').addEventListener('click',()=>location.reload());let clock=new THREE.Clock(),st=0;function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(running&&!dead){let v=speed*((keys.ShiftLeft||keys.ShiftRight)?1.35:1);if(keys.KeyW)controls.moveForward(v*dt);if(keys.KeyS)controls.moveForward(-v*dt);if(keys.KeyA)controls.moveRight(-v*dt);if(keys.KeyD)controls.moveRight(v*dt);st+=dt;if(st>Math.max(.45,1.3-level*.05)&&enemies.length<7+level){spawn();st=0}for(let e of enemies){let dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,d=Math.hypot(dx,dz);if(d>2.5){e.position.x+=dx/d*(1.2+level*.04)*dt;e.position.z+=dz/d*(1.2+level*.04)*dt}else{e.userData.cool-=dt*60;if(e.userData.cool<=0){hurt(5+level);e.userData.cool=55}}e.lookAt(camera.position.x,e.position.y,camera.position.z)}}renderer.render(scene,camera)}hud();loop();</script></body></html>
